name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck & Tests
        run: npm run check
      - name: Tests des Cloud-Relais
        run: node --test 'cloud/src/*.test.mjs'

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - name: Go vet & test
        working-directory: server
        run: |
          go vet ./...
          go test ./...
