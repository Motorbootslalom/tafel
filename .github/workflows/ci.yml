name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck & Tests
        run: npm run check
      - name: Tests des Cloud-Relais
        run: node --test 'cloud/src/*.test.mjs'

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Aus der go.mod lesen, damit CI und Modul nicht auseinanderlaufen.
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go vet & test
        working-directory: server
        run: |
          go vet ./...
          go test ./...
